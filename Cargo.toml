[workspace]
members = ["sirji", "sirji-cli", "t-sirji-fs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amitu/sirji"
rust-version = "1.97.1"   # what we build and test with; see rust-toolchain.toml

# Every dependency is declared once, here. Each crate references it with
# `<name>.workspace = true`, so versions cannot drift between crates.
[workspace.dependencies]
sirji = { path = "sirji" }

anyhow = "1"
data-encoding = "2"
iroh = { version = "1.0.3", features = ["platform-verifier"] }
iroh-mdns-address-lookup = "0.4"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync"] }
toml = "0.9"
