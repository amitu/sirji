[workspace]
members = ["sirji", "sirji-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amitu/sirji"
rust-version = "1.85"

# Every dependency is declared once, here. Each crate references it with
# `<name>.workspace = true`, so versions cannot drift between crates.
[workspace.dependencies]
sirji = { path = "sirji" }

anyhow = "1"
data-encoding = "2"
iroh = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
