# iroh-relay configuration for a private sirji relay.
#
# Copy to /etc/iroh-relay/relay.toml on the server and edit the two marked lines.
# Every value here is a documented field of iroh-relay 1.0.3's config; nothing is
# invented. Run `iroh-relay --config-path /etc/iroh-relay/relay.toml`.

# Relay traffic between endpoints. This is the point of the server: it forwards
# packets for peers that cannot reach each other directly, which is what makes
# sirji work when UDP is blocked or NAT defeats hole-punching.
enable_relay = true

# Plain HTTP. Kept on 80 because Let's Encrypt's HTTP-01 challenge needs it, and
# because the captive-portal probe is served here.
http_bind_addr = "[::]:80"

# Report each peer the address it appears to come from, over QUIC. This is what
# lets two peers behind NAT learn their own public addresses and attempt a direct
# connection instead of paying for the relay hop.
enable_quic_addr_discovery = true

# Prometheus metrics, loopback only — do not expose this.
enable_metrics = true
metrics_bind_addr = "127.0.0.1:9090"

# Who may use this relay.
#
# The default is `everyone`, and on a public host that means it will eventually
# relay for strangers who find it — bandwidth you pay for, on behalf of people you
# have never met. Choose one:
#
#   access = "everyone"                                  # open. Fine for a first test.
#   access = { shared_token = ["a-long-random-string"] }  # clients set SIRJI_RELAY_TOKEN
#   access = { allowlist = ["<id52-shaped endpoint id>"] } # only these keys
#
# A token is the practical choice: it needs no coordination when a new device
# appears, and rotating it is one edit plus a restart.
#
# What the token protects is *use of the relay*, nothing else. It is not an
# identity and grants no standing with any sirji — a relay forwards bytes it
# cannot read, so a leaked token costs bandwidth, never confidentiality.
access = "everyone"

[tls]
# ── EDIT ─── the hostname clients will dial, and where DNS points at this box.
hostname = "relay.example.com"
# ── EDIT ─── Let's Encrypt sends expiry warnings here.
contact = "you@example.com"

cert_mode = "LetsEncrypt"
prod_tls = true

# Exactly the directory systemd's StateDirectory= creates, with no subdirectory.
# iroh-relay does not create this path — it hands it to the ACME cache — and
# ProtectSystem=strict makes everything outside it read-only. Naming a
# subdirectory here risks certificates that cannot be written, which shows up as
# re-issuing on every restart until Let's Encrypt rate-limits you.
cert_dir = "/var/lib/iroh-relay"

https_bind_addr = "[::]:443"
# UDP. iroh-relay's default; must be open or QUIC address discovery silently
# does nothing and every connection pays the relay hop.
quic_bind_addr = "[::]:7842"
